<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusBite | Fuel Your Studies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-50 font-sans">
    <!-- Navigation -->
    <nav class="p-6 flex justify-between items-center bg-white shadow-sm">
      <h1 class="text-2xl font-bold text-orange-600 tracking-tight">
        CampusBite
      </h1>
      <div class="space-x-6 text-gray-600 font-medium">
        <a href="#" class="hover:text-orange-600">How it Works</a>
        <a href="#" class="hover:text-orange-600">Vendors</a>
        <button
          class="bg-orange-600 text-white px-5 py-2 rounded-full hover:bg-orange-700 transition"
        >
          Download App
        </button>
      </div>
    </nav>

    <!-- Hero Section -->
    <header
      class="max-w-6xl mx-auto px-6 py-20 flex flex-col md:flex-row items-center"
    >
      <div class="md:w-1/2 mb-10 md:mb-0">
        <h2
          class="text-5xl md:text-6xl font-extrabold text-gray-900 leading-tight"
        >
          Stop waiting in line. <br />
          <span class="text-orange-600">Start studying.</span>
        </h2>
        <p class="mt-6 text-xl text-gray-600">
          The only food delivery app designed exclusively for your campus. Fast,
          affordable, and delivered straight to your lecture hall.
        </p>
        <div class="mt-8 flex space-x-4">
          <button
            class="bg-black text-white px-8 py-4 rounded-xl flex items-center"
          >
            <i class="fab fa-apple mr-2 text-2xl"></i> App Store
          </button>
          <button
            class="bg-black text-white px-8 py-4 rounded-xl flex items-center"
          >
            <i class="fab fa-google-play mr-2 text-2xl"></i> Play Store
          </button>
        </div>
      </div>
      <div class="md:w-1/2 flex justify-center">
        <!-- Simplified App Visual -->
        <div
          class="w-64 h-[500px] bg-gray-900 rounded-[3rem] border-8 border-gray-800 shadow-2xl relative overflow-hidden"
        >
          <div class="bg-orange-500 h-1/3 p-6 pt-12">
            <div class="h-4 w-20 bg-orange-300 rounded mb-4"></div>
            <div class="h-8 w-32 bg-white rounded"></div>
          </div>
          <div class="p-4 space-y-4">
            <div
              class="h-20 w-full bg-gray-100 rounded-lg border border-gray-200"
            ></div>
            <div
              class="h-20 w-full bg-gray-100 rounded-lg border border-gray-200"
            ></div>
            <div
              class="h-20 w-full bg-gray-100 rounded-lg border border-gray-200"
            ></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="bg-orange-600 py-12">
      <div
        class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 text-center text-white"
      >
        <div>
          <h3 class="text-4xl font-bold">12 min</h3>
          <p class="opacity-80">Avg. Delivery Time</p>
        </div>
        <div>
          <h3 class="text-4xl font-bold">$0 Fees</h3>
          <p class="opacity-80">For Campus Partners</p>
        </div>
        <div>
          <h3 class="text-4xl font-bold">50+</h3>
          <p class="opacity-80">Universities Active</p>
        </div>
      </div>
    </section>

    <script src="javascript.js"></script>
    <script src="node.js"></script>
    <script src="https://kit.fontawesome.com/your-code-here.js" crossorigin="anonymous"></script>
  </body>
</html>
